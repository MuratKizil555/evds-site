<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rezervler · EVDS Pano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&display=swap" rel="stylesheet">
<style>
/* VOICE: sakin, kesin; bir gazetenin ekonomi grafik masası
   IDEA: İsviçre tarifesi — sol kenara asılı büyük rakamlar, kalın üst çizgi
   PICTURE: altın + döviz yığılmış alan grafiği, toplam çizgisi, hover ile haftalık değer
   COLOUR and TYPE: beyaz zemin, siyah mürekkep, altın için okra, düşüşte sinyal kırmızısı; Archivo
   LAYOUT: başlık + toplam, değişim şeridi, grafik, altında kırılım kartları ve tablo */
:root{color-scheme:light dark;--bg:light-dark(#fff,#0e0e0e);--ink:light-dark(#111,#f0efec);--mut:light-dark(#6b6a66,#a3a29b);--line:light-dark(#e3e2dc,#2a2a28);--soft:light-dark(#f5f4ef,#181817);--red:light-dark(#d4002a,#ff5a6e);--up:light-dark(#0a7d3b,#3ccf7a);--gold:light-dark(#c3921b,#d9a93a);--fx:light-dark(#173a73,#4f7fd1)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Archivo,system-ui,sans-serif;overflow-x:clip;font-variant-numeric:tabular-nums}
.band{padding:clamp(22px,4vw,48px) max(4vw,16px);max-width:1240px;margin:0}
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
.nav{background:var(--ink);color:var(--bg);padding:24px 16px;position:sticky;top:0;height:100vh;overflow:auto}
.nav .brand{font-weight:800;font-stretch:112%;font-size:22px;line-height:1.1;margin:0 0 4px}
.nav .tag{font-size:12px;opacity:.7;margin:0 0 22px}
.nav a{display:block;color:var(--bg);text-decoration:none;padding:10px 12px;border-radius:6px;font-weight:500;min-height:44px;opacity:.85}
.nav a:hover{opacity:1;background:color-mix(in srgb,var(--bg) 12%,transparent)}
.nav a[aria-current=page]{opacity:1;background:var(--bg);color:var(--ink)}
.nav .soon{display:block;padding:10px 12px;font-size:14px;opacity:.45}
@media(max-width:860px){.shell{grid-template-columns:1fr}.nav{position:static;height:auto;display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:12px 16px}.nav .tag,.nav .soon{display:none}.nav .brand{margin:0 12px 0 0;font-size:18px}}
.band{max-width:1240px}

header.band{padding-bottom:12px}
h1{font-size:clamp(30px,4.4vw,46px);line-height:1.05;margin:0 0 6px;font-weight:800;font-stretch:112%;text-wrap:balance}
.sub{color:var(--mut);margin:0;font-size:15px}
.hero{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;align-items:end;margin-top:22px}
.big{font-size:clamp(44px,7vw,76px);font-weight:800;font-stretch:112%;line-height:1}
.big small{font-size:.38em;font-weight:500;color:var(--mut);margin-left:6px}
.date{font-size:14px;color:var(--mut);margin-top:6px}
.chips{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:2px solid var(--ink)}
.chip{padding:10px 10px 4px 0}
.chip b{display:block;font-size:13px;font-weight:500;color:var(--mut)}
.chip .v{font-size:20px;font-weight:700;white-space:nowrap}
.chip .p{font-size:13px;white-space:nowrap}
.up{color:var(--up)}.dn{color:var(--red)}.fl{color:var(--mut)}
.ctrl{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:end;padding-top:6px;padding-bottom:6px}
.ctrl label{display:flex;flex-direction:column;font-size:13px;color:var(--mut);gap:4px}
input[type=date]{font:16px Archivo,sans-serif;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);min-height:44px}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.presets button{font:500 14px Archivo,sans-serif;min-height:44px;padding:0 14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;cursor:pointer}
.presets button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:focus-visible,input:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.mode{display:flex;gap:6px;margin-top:14px}.mode button{font:600 15px Archivo,sans-serif;min-height:44px;padding:0 18px;border:1px solid var(--ink);background:var(--bg);color:var(--ink);border-radius:6px;cursor:pointer}.mode button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.legend{display:flex;gap:18px;font-size:13px;color:var(--mut);margin:4px 0 8px;flex-wrap:wrap}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.fig{position:relative;min-height:360px}.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.chartwrap{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:24px;align-items:start}
.pie{border-top:5px solid var(--gold);padding-top:10px;font-size:14px}
.pie h3{font-size:17px;margin:0 0 2px;font-weight:700}.pie .dt{color:var(--mut);font-size:13px;margin-bottom:8px}
.pie svg{display:block;width:120px;height:120px;flex:none}
.pierow{display:flex;gap:14px;align-items:center;margin:6px 0 10px}
.side{border-left:2px solid var(--ink);padding-left:14px;flex:1}
.side table{font-size:13px}.side td{border:0;padding:4px 0 4px 8px}.side td:first-child{padding-left:0;white-space:normal}
.side .g{color:var(--mut);font-weight:400}.side tr.sum td{border-top:2px solid var(--ink);font-weight:700;padding-top:7px}
@media(max-width:420px){.pierow{flex-direction:column;align-items:flex-start}}
.pie table{font-size:13px}.pie .k{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.pie .hint{color:var(--mut);font-size:13px;margin-top:8px}
@media(max-width:760px){.chartwrap{grid-template-columns:1fr}}
.tip{position:absolute;pointer-events:none;background:var(--bg);border:1px solid var(--ink);padding:8px 10px;font-size:13px;line-height:1.45;white-space:nowrap;display:none;z-index:2}
.tip b{font-weight:700}
.rng{font-size:14px;color:var(--mut);margin-top:8px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:18px}
.card{border-top:5px solid var(--c);padding-top:12px}
.card h2{font-size:20px;margin:0;font-weight:700;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.card h2 span{font-size:14px;font-weight:500;color:var(--mut)}
.card .val{font-size:34px;font-weight:800;font-stretch:112%;margin:4px 0 2px}
.card p{margin:0 0 10px;font-size:14px;color:var(--mut)}
.share{height:8px;background:var(--soft);border-radius:4px;overflow:hidden;margin:6px 0 12px}.share>div{height:100%;background:var(--c)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-weight:500;color:var(--mut);font-size:13px}
.scroll{overflow-x:auto}
.note{font-size:14px;color:var(--mut);border-top:2px solid var(--ink);padding-top:14px}
.note p{margin:0 0 10px}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 4px;font-size:14px}
.frac>span:first-child{border-bottom:1px solid currentColor;padding:0 4px}
.frac>span:last-child{padding:0 4px}
.math{color:var(--ink);font-size:15px;display:inline-flex;align-items:center;flex-wrap:wrap;gap:2px}
.status{font-size:13px;color:var(--mut)}
.status.err{color:var(--red)}
@media(max-width:700px){.hero{grid-template-columns:1fr}.chips{grid-template-columns:repeat(2,minmax(0,1fr))}.fig{min-height:280px}}
@media(prefers-reduced-motion:no-preference){.share>div{transition:width .4s}}
</style>
</head>
<body>
<div class="shell"><nav class="nav" id="nav" aria-label="Bölümler"></nav><div class="main">
<header class="band">
  <h1 id="ttl">TCMB brüt rezervleri</h1>
  <p class="sub" id="sub">Haftalık resmi rezerv varlıkları, altın ve döviz kırılımıyla · milyar ABD doları</p>
  <div class="mode" id="mode" role="group" aria-label="Rezerv türü"><button data-m="brut" aria-pressed="true">Brüt rezerv</button><button data-m="net" aria-pressed="false">Net rezerv</button></div>
  <div class="hero">
    <div>
      <div class="big" id="tot">—<small>mr $</small></div>
      <div class="date" id="last">Veri yükleniyor…</div>
    </div>
  </div>
</header>

<section class="band" style="padding-top:8px">
  <div class="ctrl">
    <label>Başlangıç<input type="date" id="from" min="1987-12-25"></label>
    <label>Bitiş<input type="date" id="to" min="1987-12-25"></label>
    <div class="presets" id="presets" role="group" aria-label="Hazır aralıklar">
      <button data-y="m">1M</button><button data-y="ytd">YTD</button><button data-y="1">1Y</button><button data-y="3">3Y</button><button data-y="5">5Y</button><button data-y="10">10Y</button><button data-y="all">Tümü</button>
    </div>
  </div>
  <div class="legend" id="legend"><span><i style="background:var(--gold)"></i>Altın</span><span><i style="background:var(--fx)"></i>Döviz</span><span><i style="background:var(--red);height:3px;vertical-align:3px"></i>Toplam</span></div>
  <div class="chartwrap"><div class="fig" id="fig"><svg id="svg" role="img" aria-label="Seçili aralıkta haftalık altın ve döviz rezervlerinin yığılmış çubuk grafiği ve toplam rezerv çizgisi"></svg><div class="tip" id="tip"></div></div><aside class="pie" id="pie" aria-live="polite"><h3>Haftalık rezerv değişimi</h3><div class="dt">Grafikte bir haftaya tıklayın.</div></aside></div>
  <div class="rng" id="rng"></div>
  <p class="status" id="status"></p>
</section>
</div></div>
<script>
{
  // Sitenin sol menüsü. Yeni bölüm eklemek için SECTIONS listesine bir satır ekle.
  const SECTIONS = [
    { id: 'rezerv', title: 'Rezerv', href: '#' }
  ];
  const SOON = ['Fiyatlar', 'Döviz', 'Parasal', 'Dış istatistikler'];
  const here = location.pathname.split('/').filter(Boolean);
  const nav = document.getElementById('nav');
  if (nav) {
    const brand = document.createElement('p'); brand.className = 'brand'; brand.textContent = 'EVDS Pano';
    const tag = document.createElement('p'); tag.className = 'tag'; tag.textContent = 'TCMB istatistikleri, her gün güncel';
    nav.append(brand, tag);
    for (const s of SECTIONS) {
      const a = document.createElement('a'); a.href = s.href; a.textContent = s.title;
      if (s.id === 'rezerv') a.setAttribute('aria-current', 'page');
      nav.append(a);
    }
    for (const t of SOON) { const sp = document.createElement('span'); sp.className = 'soon'; sp.textContent = t + ' · yakında'; nav.append(sp); }
  }
}

</script>
<script>
{
const SERVER='TCMB MCP',TOOL='get_series_data';
const S={tot:'TP.AB.TOPLAM',gold:'TP.AB.C1',fx:'TP.AB.C2'};
const MIN=new Date(Date.UTC(1987,11,25));
const NS={A02:'TP.AB.A02',A10:'TP.AB.A10',usd:'TP.DK.USD.A.YTL'};const ALL={...S,...NS};
const data={tot:new Map(),gold:new Map(),fx:new Map(),A02:new Map(),A10:new Map(),usd:new Map()};let mode='brut';
const $=id=>document.getElementById(id);
const nf=new Intl.NumberFormat('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2});
const pf=new Intl.NumberFormat('tr-TR',{minimumFractionDigits:1,maximumFractionDigits:1});
const df=new Intl.DateTimeFormat('tr-TR',{day:'2-digit',month:'2-digit',year:'numeric',timeZone:'UTC'});
const mr=v=>nf.format(v/1000);
const iso=d=>d.toISOString().slice(0,10);
const today=new Date();today.setUTCHours(0,0,0,0);
let sel=null,selOff=true,rA=null,rB=null,pxArr=[];const px=new Map();let range={from:null,to:null},preset='ytd',loadedFrom=null,errors=0;

function parseDate(s){let m=/^(\d{2})-(\d{2})-(\d{4})$/.exec(s);if(m)return Date.UTC(+m[3],+m[2]-1,+m[1]);m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s);return m?Date.UTC(+m[1],+m[2]-1,+m[3]):null}
function strings(x,out=[]){if(typeof x==='string')out.push(x);else if(Array.isArray(x))x.forEach(y=>strings(y,out));else if(x&&typeof x==='object')Object.values(x).forEach(y=>strings(y,out));return out}
function rowsOf(payload,key){
  const res=[];const col=key.replace(/\./g,'_');
  const walk=x=>{if(Array.isArray(x))x.forEach(walk);else if(x&&typeof x==='object'){const t=x.Tarih??x.tarih??x.date;const v=x[col]??x[key];if(t!=null&&v!=null){const d=parseDate(String(t)),n=parseFloat(v);if(d!=null&&isFinite(n))res.push([d,n])}else Object.values(x).forEach(walk)}};
  walk(payload);
  if(!res.length)for(const s of strings(payload))for(const line of s.split('\n')){const c=line.split('|').map(z=>z.trim()).filter(z=>z!=='');if(c.length<2)continue;const d=parseDate(c[0]),n=parseFloat(c[c.length-1]);if(d!=null&&isFinite(n))res.push([d,n])}
  return res;
}

function netSeries(){const ds=[...data.A02.keys()].sort((a,b)=>a-b);const out=[];for(const d of ds){if(d>today.getTime())continue;const A=data.A02.get(d),Lb=data.A10.get(d),k=data.usd.get(d);if(A==null||Lb==null||!k)continue;const a=A/k/1000,l=Lb/k/1000;out.push({d,a,l,n:a-l})}return out}
function curSeries(){return mode==='net'?netSeries():series()}
function series(){const ds=[...data.tot.keys()].sort((a,b)=>a-b);return ds.map(d=>({d,t:data.tot.get(d),g:data.gold.get(d),f:data.fx.get(d)})).filter(r=>r.g!=null&&r.f!=null)}
function refAt(arr,t){let lo=0,hi=arr.length-1,ans=null;while(lo<=hi){const m=(lo+hi)>>1;if(arr[m].d<=t){ans=arr[m];lo=m+1}else hi=m-1}return ans}
function windows(arr){
  const L=arr[arr.length-1],d=new Date(L.d);
  const m1=new Date(d);m1.setUTCMonth(m1.getUTCMonth()-1);
  const y1=new Date(d);y1.setUTCFullYear(y1.getUTCFullYear()-1);
  return [['1W','1W · 1 hafta',arr[arr.length-2]],['1M','1M · 1 ay',refAt(arr,m1.getTime())],['YTD','YTD · yılbaşından beri',refAt(arr,Date.UTC(d.getUTCFullYear()-1,11,31))],['1Y','1Y · 1 yıl',refAt(arr,y1.getTime())]];
}
function chg(now,ref){if(ref==null||now==null)return null;return{a:now-ref,p:(now/ref-1)*100}}
function cls(c){return !c?'fl':c.a>0?'up':c.a<0?'dn':'fl'}
function sign(v){return (v>0?'+':v<0?'−':'')}
function fmtA(c){return c?sign(c.a)+mr(Math.abs(c.a)):'—'}
function fmtP(c){return c?sign(c.p)+'%'+pf.format(Math.abs(c.p)):'—'}

function render(){if(mode==='net'){renderNet();return}
  const all=series();
  if(!all.length)return;
  const L=all[all.length-1],W=windows(all);
  $('tot').firstChild.nodeValue=mr(L.t)+' ';
  $('last').textContent='Son veri: '+df.format(new Date(L.d))+' (Cuma)';
  if($('chips'))$('chips').innerHTML=W.map(([k,lab,r])=>{const c=chg(L.t,r&&r.t);return `<div class="chip"><b>${lab}</b><div class="v ${cls(c)}">${fmtA(c)}</div><div class="p ${cls(c)}">${fmtP(c)}</div></div>`}).join('');
  const from=range.from??(L.d-365*864e5),to=range.to??L.d;
  const a0=refAt(all,from)||all.find(r=>r.d>=from);const view=all.filter(r=>r.d>=(a0?a0.d:from)&&r.d<=to);
  rA=a0;rB=view[view.length-1];draw(view);renderPie();
  const a=a0,b=view[view.length-1];
  $('rng').textContent=view.length>=1&&a?`Grafik ve değişim: ${df.format(new Date(a.d))} – ${df.format(new Date(b.d))} · ilk çubuk başlangıç (referans) haftasıdır`:'Seçili aralıkta veri yok.';
  const parts=[['Altın','g','--gold'],['Döviz','f','--fx']];
  if($('cards'))$('cards').innerHTML=parts.map(([n,k,c])=>{const sh=L[k]/L.t*100;const rows=W.map(([kk,lab,r])=>{const x=chg(L[k],r&&r[k]);return `<tr><td>${lab}</td><td class="${cls(x)}">${fmtA(x)}</td><td class="${cls(x)}">${fmtP(x)}</td></tr>`}).join('');
    const sx=view.length&&a?chg(b[k],a[k]):null;
    return `<div class="card" style="--c:var(${c})"><h2>${n}<span>(%${pf.format(sh)})</span></h2><div class="val">${mr(L[k])} <small style="font-size:.45em;color:var(--mut);font-weight:500">mr $</small></div><div class="share"><div style="width:${sh.toFixed(1)}%"></div></div><table><tr><th>Pencere</th><th>mr $</th><th>%</th></tr>${rows}<tr><td>Seçili aralık</td><td class="${cls(sx)}">${fmtA(sx)}</td><td class="${cls(sx)}">${fmtP(sx)}</td></tr></table></div>`}).join('');
  const lines=[['Toplam','t'],['Altın','g'],['Döviz','f']];
  const head=`<tr><th></th><th>Son</th>${W.map(w=>`<th>${w[0]}</th>`).join('')}<th>Seçili aralık</th><th>Altın payı değişimi</th></tr>`;
  if($('tbl'))$('tbl').innerHTML=head+lines.map(([n,k])=>{const cells=W.map(([kk,lab,r])=>{const x=chg(L[k],r&&r[k]);return `<td class="${cls(x)}">${fmtA(x)}<br><small>${fmtP(x)}</small></td>`}).join('');const sx=view.length&&a?chg(b[k],a[k]):null;
    let shc='';if(k==='g'&&view.length&&a){const d=(b.g/b.t-a.g/a.t)*100;shc=`<td class="${d>0?'up':d<0?'dn':'fl'}">${sign(d)}${pf.format(Math.abs(d))} puan</td>`}else shc='<td></td>';
    return `<tr><td><b>${n}</b></td><td>${mr(L[k])}${k==='t'?'':`<br><small>(%${pf.format(L[k]/L.t*100)})</small>`}</td>${cells}<td class="${cls(sx)}">${fmtA(sx)}<br><small>${fmtP(sx)}</small></td>${shc}</tr>`}).join('');
}

const svg=$('svg'),tip=$('tip');let cur=[];
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}
function draw(view){
  cur=view;const Wd=svg.clientWidth,H=svg.clientHeight;if(!Wd||!H)return;
  const narrow=Wd<520,m={l:narrow?34:48,r:12,t:10,b:28},w=Wd-m.l-m.r,h=H-m.t-m.b;
  if(!view.length){svg.innerHTML='';return}
  const x0=view[0].d-3.5*864e5,x1=Math.max(view[view.length-1].d+3.5*864e5,x0+120*864e5),ymax=Math.max(...view.map(r=>r.g+r.f,r=>r.t))*1.08;
  const X=d=>m.l+(d-x0)/(x1-x0||1)*w,Y=v=>m.t+h-v/ymax*h;
  const area=(lo,hi)=>'M'+view.map(r=>X(r.d)+','+Y(hi(r))).join('L')+'L'+view.slice().reverse().map(r=>X(r.d)+','+Y(lo(r))).join('L')+'Z';
  const step=niceStep(ymax/1000,narrow?4:6)*1000;let g='';
  for(let v=0;v<=ymax;v+=step)g+=`<line x1="${m.l}" x2="${m.l+w}" y1="${Y(v)}" y2="${Y(v)}" stroke="${css('--line')}"/><text x="${m.l-6}" y="${Y(v)+4}" text-anchor="end" font-size="12" fill="${css('--mut')}">${Math.round(v/1000)}</text>`;
  const spanY=(x1-x0)/(365*864e5);const ticks=[];const s=new Date(x0);
  if(spanY>2){const k=Math.max(1,Math.ceil(spanY/(narrow?4:8)));for(let y=s.getUTCFullYear()+1;Date.UTC(y,0,1)<=x1;y++)if(y%k===0)ticks.push([Date.UTC(y,0,1),String(y)])}
  else{const k=spanY>1?3:spanY>.5?2:1;let d=new Date(Date.UTC(s.getUTCFullYear(),s.getUTCMonth()+1,1));while(d.getTime()<=x1){if(d.getUTCMonth()%k===0)ticks.push([d.getTime(),d.toLocaleDateString('tr-TR',{month:'short',year:'2-digit',timeZone:'UTC'})]);d.setUTCMonth(d.getUTCMonth()+1)}}
  for(const [t,l] of ticks)g+=`<text x="${X(t)}" y="${H-8}" text-anchor="middle" font-size="12" fill="${css('--mut')}">${l}</text>`;

      if(range.to==null){const a=curSeries();if(a.length)setPreset(preset??'ytd');}else render()}
    else if(ev.type==='error'){pending.delete(tag);errors++;status('EVDS bağlantısında hata: '+String((ev.error&&(ev.error.code||ev.error.message))||'bilinmiyor')+'. Sayfayı yenileyin ya da TCMB bağlantınızı kontrol edin.',true)}
  });
}
function watchPx(s,e){const tag='px'+iso(s);pending.add(tag);
  mcp.watchTool(SERVER,TOOL,{series_code:'TP.ALTINPIYASA.KAP03',start_date:iso(s),end_date:iso(e),full_data:true},ev=>{
    if(ev.type==='data'){for(const [d,v] of rowsOf(ev.result&&ev.result.payload,'TP.ALTINPIYASA.KAP03'))px.set(d,v);pxArr=[...px.entries()].sort((a,b)=>a[0]-b[0]);pending.delete(tag);renderPie()}
    else if(ev.type==='error'){pending.delete(tag);status('Altın fiyatı yüklenemedi: '+String((ev.error&&(ev.error.code||ev.error.message))||'bilinmiyor'),true)}})}
function ensure(from){
  if(!mcp||loadedFrom==null)return;
  while(loadedFrom>from&&loadedFrom>MIN.getTime()){const e=new Date(loadedFrom-864e5);const s=new Date(loadedFrom);s.setUTCFullYear(s.getUTCFullYear()-15);const st=s<MIN?MIN:s;for(const k in ALL)watch(k,st,e);loadedFrom=st.getTime()}
}
(async()=>{
  status('EVDS bağlantısı kuruluyor…');
  try{mcp=await window.claude.use('mcp')}catch(e){mcp=null}
  if(!mcp){status('Bu sayfa verileri sizin TCMB EVDS bağlantınızla çeker. Bağlantı bu görünümde kullanılamıyor; Claude içinde açıp TCMB bağlantısına izin verin.',true);return}
  const s=new Date(today);s.setUTCFullYear(s.getUTCFullYear()-15);
  for(const k in ALL)watch(k,s,today);loadedFrom=s.getTime();
  for(let y=2018;y<=today.getUTCFullYear();y+=3){const a=new Date(Date.UTC(y,6,1)),b=new Date(Date.UTC(y+3,5,30));watchPx(a,b>today?today:b)}
})();
}
